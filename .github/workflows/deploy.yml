name: deploy

# Build the production Docker image and publish it to GitHub Container Registry
# (GHCR) on every push to main and on version tags. The server's Watchtower
# (see deploy/docker-compose.cd.yml) then auto-pulls the new image and restarts
# the web container — so a merge to main redeploys itself, no manual SSH.
#
# Rollback: pin WEB_IMAGE in the server .env to a specific tag, e.g.
#   WEB_IMAGE=ghcr.io/<owner>/<repo>:sha-<commit>
# and `docker compose ... up -d`.

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  # One publish per ref at a time; a newer push supersedes an in-flight build.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the image name for us (GHCR requires it).
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions layer cache so rebuilds reuse unchanged layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
