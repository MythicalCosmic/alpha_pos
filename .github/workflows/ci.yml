name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # DEBUG=True lets settings.py boot without a real SECRET_KEY and keeps
      # the suite running against the in-repo SQLite file. Production-only
      # paths (HSTS, secure cookies, etc.) aren't under test here.
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: alpha_pos.settings

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check

      - name: Migrations up-to-date
        run: python manage.py makemigrations --check --dry-run

      - name: Lint (ruff)
        # Soft-fail: surface issues in the CI log without blocking merges
        # while we work through the existing backlog. Promote to a hard
        # fail (drop continue-on-error) after the first cleanup pass.
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Dependency audit (pip-audit)
        # Soft-fail: surface known-vulnerable deps in the CI log without
        # blocking merges. After the first triage pass, drop
        # continue-on-error and add suppressions in pip-audit.toml only for
        # accepted risks.
        run: pip-audit --strict
        continue-on-error: true

      - name: pytest
        run: |
          pytest -q \
            --ignore=test_all_endpoints.py \
            --ignore=test_endpoints.py
